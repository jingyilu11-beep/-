<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c8102e">
<title>埃及方言随身练</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1f2430; --ink2:#5b6472;
    --line:#e5e8ee; --brand:#c8102e; --brand2:#e8556d;
    --ok:#1a7f4e; --okbg:#e6f4ec; --warn:#b7791f; --warnbg:#fdf3e0;
    --bad:#b3362c; --badbg:#fbeae8; --gold:#b7791f;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:64px;
  }
  .ar{font-family:"Noto Naskh Arabic","Geeza Pro","KufiStandardGK","Traditional Arabic",serif; direction:rtl; unicode-bidi:isolate;}
  .wrap{max-width:640px; margin:0 auto; padding:14px 14px 40px;}

  /* ---------- header ---------- */
  header{display:flex; align-items:center; gap:10px; padding:8px 2px 12px;}
  .logo{width:42px; height:42px; border-radius:12px; background:var(--brand); color:#fff;
        display:flex; align-items:center; justify-content:center; font-size:22px; flex:0 0 auto;}
  header h1{font-size:19px; font-weight:800;}
  header .sub{font-size:11.5px; color:var(--ink2); margin-top:2px;}

  /* ---------- tab bar ---------- */
  .tabbar{position:fixed; bottom:0; left:0; right:0; z-index:50; background:rgba(255,255,255,.96);
          backdrop-filter:blur(10px); border-top:1px solid var(--line);
          display:flex; padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1; text-align:center; padding:8px 0 6px; font-size:11px; color:var(--ink2);
       border:none; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .tab .ic{font-size:20px; line-height:1;}
  .tab.on{color:var(--brand); font-weight:700;}
  .tab.on .ic{transform:scale(1.08);}

  /* ---------- home ---------- */
  .sec-title{font-size:15px; font-weight:800; margin:16px 2px 8px; display:flex; align-items:center; gap:6px;}
  .sec-title small{font-weight:500; color:var(--ink2); font-size:11.5px;}
  .scene-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .scene-tile{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px;
              text-align:left; cursor:pointer; box-shadow:0 1px 3px rgba(20,30,50,.04);}
  .scene-tile:active{transform:scale(.97); background:#fafbfc;}
  .scene-tile .em{font-size:22px;}
  .scene-tile .nm{font-size:13.5px; font-weight:700; margin-top:5px; line-height:1.35;}
  .scene-tile .nb{font-size:10.5px; color:var(--ink2); margin-top:3px;}
  .scene-tile .nb b{color:var(--brand);}
  .mix-tile{display:flex; align-items:center; gap:12px; width:100%; background:linear-gradient(135deg,#eaf3ff,#f6f0ff);
            border:1px solid #c9ddf8; border-radius:16px; padding:14px 14px; margin-top:4px;
            text-align:left; cursor:pointer; box-shadow:0 1px 4px rgba(20,30,50,.05);}
  .mix-tile:active{transform:scale(.98);}
  .mix-tile .em{font-size:26px;}
  .mix-tile .nm{font-size:15px; font-weight:800; color:var(--brand);}
  .mix-tile .nb{font-size:11px; color:var(--ink2); margin-top:2px;}
  .mix-tile .go{margin-left:auto; font-size:12px; font-weight:800; color:var(--brand);
                background:#fff; border:1px solid #c9ddf8; border-radius:99px; padding:5px 12px; white-space:nowrap;}
  .tile-full{grid-column:1/-1;}
  .install-hint{background:var(--okbg); border:1px solid #bfe3cf; border-radius:12px; padding:10px 12px;
                font-size:12px; color:var(--ok); line-height:1.6; margin-top:14px; display:none;}

  /* ---------- quiz ---------- */
  .quiz-top{display:flex; align-items:center; gap:8px; margin:4px 2px 10px;}
  .back{font-size:13px; color:var(--ink2); border:1px solid var(--line); background:var(--card);
        border-radius:99px; padding:6px 12px; cursor:pointer;}
  .back:active{background:#f0f1f4;}
  .quiz-title{font-size:15px; font-weight:800; flex:1;}
  .progress{font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums;}
  .bar{height:5px; background:var(--line); border-radius:99px; overflow:hidden; margin:2px 2px 12px;}
  .bar i{display:block; height:100%; background:var(--brand); border-radius:99px; transition:width .25s;}

  .stage{perspective:1000px;}
  .fcard{position:relative; width:100%; min-height:300px; cursor:pointer; transform-style:preserve-3d;
         transition:transform .45s;}
  .fcard.flip{transform:rotateY(180deg);}
  .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
        background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px 18px;
        display:flex; flex-direction:column; box-shadow:0 2px 8px rgba(20,30,50,.06);}
  .face .tag{font-size:11px; color:var(--ink2); font-weight:600; letter-spacing:.5px;}
  .face-front{align-items:center; justify-content:center; text-align:center;}
  .fword{font-size:44px; font-weight:800; color:var(--brand); line-height:1.3;}
  .ftr{font-size:14px; color:var(--ink2); font-style:italic; margin-top:8px;}
  .ftap{font-size:11px; color:#b9bfc9; margin-top:22px;}
  .face-back{align-items:flex-start; justify-content:center; transform:rotateY(180deg);}
  .b-zh{font-size:22px; font-weight:800;}
  .b-sc{font-size:11px; font-weight:700; color:var(--brand); background:#eaf2ff; border-radius:99px;
        padding:3px 10px; margin-bottom:8px; display:inline-block;}
  .b-msa{font-size:13px; color:#1455c7; margin-top:6px;}
  .b-msa .ar{font-size:15px;}
  .b-ex{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; width:100%;}
  .b-ex .e-ar{font-size:15px; line-height:1.7; color:#333;}
  .b-ex .e-zh{font-size:13px; color:#5b6472; margin-top:3px;}
  .b-ex .e-msa{font-size:12.5px; color:#1455c7; margin-top:4px; opacity:.85;}
  .b-usage{margin-top:10px; font-size:12.5px; color:var(--ok); line-height:1.6; width:100%;}
  .b-freq{font-size:11px; color:var(--ink2); margin-top:10px;}

  .quiz-acts{display:flex; gap:8px; margin-top:14px;}
  .qa{flex:1; border:none; border-radius:12px; padding:13px 0; font-size:14px; font-weight:700;
      cursor:pointer; color:#fff;}
  .qa:active{transform:scale(.96);}
  .qa.no{background:var(--bad);}
  .qa.mid{background:var(--warn);}
  .qa.yes{background:var(--ok);}
  .qa:disabled{opacity:.35;}

  .qresult{text-align:center; padding:20px 6px;}
  .qresult .big{font-size:52px;}
  .qresult h3{font-size:20px; margin-top:8px;}
  .qresult .row{display:flex; gap:8px; margin:16px 0 4px;}
  .qstat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px;}
  .qstat b{font-size:22px; display:block;}
  .qstat span{font-size:11px; color:var(--ink2);}
  .qstat.good b{color:var(--ok);} .qstat.mid b{color:var(--warn);} .qstat.bad b{color:var(--bad);}
  .qresult .btns{display:flex; gap:8px; margin-top:14px;}
  .rbtn{flex:1; border:1px solid var(--line); background:var(--card); border-radius:12px;
        padding:12px 0; font-size:13px; font-weight:700; cursor:pointer;}
  .rbtn.main{background:var(--brand); color:#fff; border-color:var(--brand);}
  .rbtn:active{transform:scale(.96);}

  .empty{text-align:center; color:var(--ink2); font-size:13px; padding:30px 10px;}

  /* ---------- handbook / patterns ---------- */
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:11px;
        box-shadow:0 1px 3px rgba(20,30,50,.04);}
  .card.dim{opacity:.55;}
  .cw{font-size:20px; font-weight:800; color:var(--brand);}
  .ctr{font-size:10.5px; color:var(--ink2); font-style:italic; margin-top:1px;}
  .czh{font-size:13px; font-weight:700; margin-top:5px;}
  .cmsa{font-size:11px; color:#1455c7; margin-top:2px;}
  .cex{margin-top:6px; border-top:1px dashed var(--line); padding-top:5px; font-size:11.5px; color:#444; line-height:1.55;}
  .cex .ar{color:#333;}
  .cex .e-zh{color:#5b6472; font-size:11px; margin-top:2px;}
  .brk-toggle{margin-top:5px; font-size:10.5px; color:#1455c7; background:#eef3fd; border:1px solid #d5e2f8;
              border-radius:99px; padding:3px 10px; cursor:pointer; font-weight:600; display:inline-block;}
  .brk-toggle:active{background:#e2ebfa;}
  .brk{display:none; margin-top:7px; border-top:1px dashed var(--line); padding-top:6px;}
  .brk.on{display:block;}
  .brk-zh{font-size:11px; color:var(--ink2); margin-bottom:5px; line-height:1.5;}
  .brk-tags{display:flex; flex-wrap:wrap; gap:4px;}
  .btag{display:inline-flex; flex-direction:column; align-items:center; background:#f5f7fb; border:1px solid var(--line);
        border-radius:7px; padding:3px 6px; min-width:56px;}
  .btag b{font-size:13px; color:var(--brand); direction:rtl; unicode-bidi:isolate; font-weight:700;}
  .btag i{font-size:9px; color:#1455c7; font-style:normal; font-weight:600;}
  .btag em{font-size:9.5px; color:var(--ink2); font-style:normal;}
  .btag.unk{border-style:dashed; opacity:.55;}
  .btag.unk b{color:var(--ink2);}
  .btag.unk i{color:#b0b7c2;}
  .btag.unk em{color:#b0b7c2;}
  .scene-h{display:flex; align-items:center; gap:8px; margin:14px 2px 8px;}
  .scene-h .em{font-size:20px;}
  .scene-h .nm{font-size:15px; font-weight:800;}
  .scene-h .cnt{font-size:11px; color:var(--ink2); margin-left:auto;}
  .sdesc{font-size:12px; color:var(--ink2); line-height:1.6; margin:0 2px 10px;}

  .ptns{display:flex; flex-direction:column; gap:8px;}
  .ptn{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .ptn-ar{font-size:18px; font-weight:800; color:var(--brand);}
  .ptn-zh{font-size:14px; font-weight:700; margin-top:3px;}
  .ptn-tr{font-size:11.5px; color:var(--ink2); font-style:italic; margin-top:2px;}
  .ptn-note{font-size:11px; color:var(--ok); margin-top:4px;}
  .ptn-brk{margin-top:8px; border-top:1px dashed var(--line); padding-top:7px;}

  /* ---------- scene picker ---------- */
  .picker{margin-top:6px;}
  .pill{display:inline-block; border:1px solid var(--line); background:var(--card); border-radius:99px;
        padding:7px 13px; font-size:12.5px; margin:0 6px 8px 0; cursor:pointer; font-weight:600;}
  .pill:active{transform:scale(.96);}
  .pill.on{background:var(--brand); color:#fff; border-color:var(--brand);}
  .subnote{font-size:11.5px; color:var(--ink2); margin:2px 2px 10px; line-height:1.6;}

  .tab-page{display:none;}
  .tab-page.on{display:block;}

  /* ---------- toast ---------- */
  .toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
         background:rgba(31,36,48,.92); color:#fff; font-size:13px; padding:10px 18px;
         border-radius:99px; z-index:99; opacity:0; pointer-events:none; transition:opacity .3s;}
  .toast.show{opacity:1;}
</style>
</head>

/* ---------- 工具 ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

function headerHtml(){

}

function homeHtml(){
  const total = DATA.scenes.filter(s=>s.key!=='extra').reduce((n,s)=>n+s.quiz.length,0);
  const tiles = DATA.scenes.filter(s=>s.key!=='extra').map(s=>`
    <button class="scene-tile" onclick="startQuiz('${s.key}')">
      <div class="em">${s.emoji}</div>

  const ex = DATA.scenes.filter(s=>s.key==='extra').map(s=>`
    <button class="scene-tile tile-full" onclick="goTab('handbook')">

  return headerHtml() + `

}

function resultHtml(){
  const rs = state.results;
  const good = rs.filter(r=>r===2).length, mid = rs.filter(r=>r===1).length, bad = rs.filter(r=>r===0).length;
  const pct = Math.round(good/rs.length*100);
  const face = pct>=80?'🎉':pct>=50?'💪':'📖';
  const msg = pct>=80?'太棒了，这批词你掌握得很好！':pct>=50?'不错，再练一轮生词就稳了。':'别急，点“只练生词”把不熟的过一遍。';
  return `${headerHtml()}
    <div class="qresult">
      <div class="big">${face}</div>
      <h3>本轮完成！</h3>
      <div class="row">
        <div class="qstat good"><b>${good}</b><span>认识</span></div>
        <div class="qstat mid"><b>${mid}</b><span>不确定</span></div>
        <div class="qstat bad"><b>${bad}</b><span>不认识</span></div>
      </div>
      <div style="font-size:12.5px;color:var(--ink2);margin-top:6px">正确率 ${pct}% · ${msg}</div>
      <div class="btns">
        <button class="rbtn" onclick="restartQuiz(false)">再来一轮</button>
        <button class="rbtn main" onclick="restartQuiz(true)">只练生词</button>
      </div>
    </div>`;
}

/* ---------- handbook ---------- */
function btagsHtml(annot){
  return `<div class="brk-tags">` + annot.map(t=>{
    const unk = !t.zh;
    return `<span class="btag${unk?' unk':''}"><b class="ar">${esc(t.w)}</b>${t.g?`<i>${esc(t.g)}</i>`:''}<em>${esc(t.zh)||'…'}</em></span>`;
  }).join('') + `</div>`;
}
function brkBlock(annot, whole){
  const zh = whole ? `<div class="brk-zh">📖 ${esc(whole)}</div>` : '';
  return `<div class="brk-toggle" onclick="this.nextElementSibling.classList.toggle('on'); this.textContent = this.nextElementSibling.classList.contains('on')?'▲ 收起逐词':'🔍 逐词拆解'">🔍 逐词拆解</div>
    <div class="brk">${zh}${btagsHtml(annot)}</div>`;
}
function handbookHtml(){
  let out = headerHtml();
  DATA.scenes.forEach(s=>{
    out += `<div class="scene-h"><span class="em">${s.emoji}</span><span class="nm">${s.name}</span>
      <span class="cnt">${s.items.length} 词</span></div>
      <div class="sdesc">${s.desc}</div>
      <div class="cards">` +
      s.items.map(it=>{
        const dim = it.map?'':' dim';
        let extra='';
        if(it.ex) extra = `<div class="cex"><div class="ar">${esc(it.ex)}</div>${it.exzh?`<div class="e-zh">${esc(it.exzh)}</div>`:''}${brkBlock(it.exb)}</div>`;
        else if(it.u) extra = `<div class="cex">💬 ${esc(it.u)}</div>`;
        return `<div class="card${dim}">
          <div class="cw ar">${esc(it.w)}</div>
          <div class="ctr">${esc(it.t)}</div>
          <div class="czh">${esc(it.zh)}</div>
          ${it.m?`<div class="cmsa">标准语 <span class="ar">${esc(it.m)}</span></div>`:''}
          ${extra}</div>`;
      }).join('') + `</div>`;
  });
  return out;
}

/* ---------- patterns ---------- */
function patternsHtml(){
  let out = headerHtml();
  DATA.scenes.forEach(s=>{
    if(!s.patterns.length) return;
    out += `<div class="scene-h"><span class="em">${s.emoji}</span><span class="nm">${s.name}</span>
      <span class="cnt">${s.patterns.length} 句</span></div>
      <div class="ptns">` +
      s.patterns.map(p=>`<div class="ptn">
        <div class="ptn-ar ar">${esc(p.d)}</div>
        <div class="ptn-zh">${esc(p.zh)}</div>
        <div class="ptn-tr">${esc(p.t)}</div>
        <div class="ptn-note">💡 ${esc(p.note)}</div>
        ${p.b&&p.b.length?`<div class="ptn-brk">${btagsHtml(p.b)}</div>`:''}
      </div>`).join('') + `</div>`;
  });
  return out;
}

/* ---------- 状态流转 ---------- */
function render(){
  const tabs = [
    ['home','🏠','练习'], ['handbook','📖','手册'], ['ptn','💬','句型']
  ];
  $('#tabbar').innerHTML = tabs.map(t=>{
    const on = state.tab===t[0] || (state.tab==='quiz' && t[0]==='home');
    return `<button class="tab${on?' on':''}" onclick="goTab('${t[0]}')">
      <span class="ic">${t[1]}</span>${t[2]}</button>`;
  }).join('');
  let body='';
  if(state.tab==='home') body = homeHtml();
  else if(state.tab==='handbook') body = handbookHtml();
  else if(state.tab==='ptn') body = patternsHtml();
  else if(state.tab==='quiz'){
    if(!state.started) body = quizHtml();
    else body = resultHtml();
  }
  $('#app').innerHTML = body;
  if((state.tab==='home' || state.tab==='quiz') && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
     && !navigator.standalone && !window.matchMedia('(display-mode: standalone)').matches){
    const h=$('#installHint'); if(h) h.style.display='block';
  }
}
function goTab(t){ state.tab=t; state.quiz=null; render(); window.scrollTo(0,0); }
function goHome(){ state.tab='home'; state.quiz=null; render(); window.scrollTo(0,0); }

function startQuiz(key){
  const s = DATA.scenes.find(x=>x.key===key);
  state.scene=key; state.sceneObj=s; state.quiz=true; state.started=false;
  state.deck = shuffle(s.quiz); state.idx=0; state.results=[];
  state.tab='quiz';   /* 关键：切到自测视图 */
  render(); window.scrollTo(0,0);
  toast('开始自测 · '+s.quiz.length+' 词');
}
function startAllQuiz(){
  const pool = [];
  DATA.scenes.filter(s=>s.key!=='extra').forEach(s=>
    s.quiz.forEach(it=>pool.push(Object.assign({}, it, {_sc:s.emoji+' '+s.name}))));
  state.scene='all'; state.sceneObj={emoji:'🎲', name:'全部混练'};
  state.quiz=true; state.started=false;
  state.deck = shuffle(pool); state.idx=0; state.results=[];
  state.tab='quiz';
  render(); window.scrollTo(0,0);
  toast('全部混练 · '+pool.length+' 词');
}
function cancelQuiz(){ goHome(); }
function flip(){ $('#fcard').classList.toggle('flip'); }
function rate(v){
  if(state.results[state.idx]!=null) return;
  state.results[state.idx]=v;
  state.idx++;
  if(state.idx>=state.deck.length){ state.started=true; render(); }
  else { render(); window.scrollTo(0,0); }
}
function restartQuiz(onlyMiss){
  const s = state.sceneObj;
  let pool = state.deck;
  if(onlyMiss){
    pool = state.deck.filter((_,i)=>state.results[i]!==2);
    if(!pool.length){ toast('这轮全认识，无需复习 🎉'); return; }
  }
  state.deck = shuffle(pool); state.idx=0; state.results=[]; state.started=false;
  render(); window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
